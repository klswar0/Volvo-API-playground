<div  id="car-info" class="flex flex-col justify-center items-center gap-4 mt-6">
    <button hx-get="/internal/dashboard/car/v2/Base?key={{ key }}&VIN={{ VIN }}" hx-target="#car-info"
        hx-swap="outerHTML transition:true"
        class="sec min-w-40 whitespace-nowrap mt-4 px-4 py-2.5 text-lg bg-blue-500/50 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
        Back
    </button>

   
        <div id="fuelAndBattery" class="flex flex-row flex-wrap gap-4 mt-6 justify-center">
        <section class=" w-full max-w-75 sm:max-w-75 sm:min-w-50 order-first lg:order-2 dashboardSectionRe sec">
            <p class="text-lg md:text-xl">Fuel Type:</p>
                <div class="mt-2 mb-4">
                    <p class="text-base md:text-lg" id="fuelType">{{fuelType}} </p>
                </div>
                <form data-attribute="fuelType" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                    <input type="hidden" name="attribute" value="fuelType">
                    <select name="value" class="inputSelection">
                        <option value="PETROL">PETROL</option>
                        <option value="DIESEL">DIESEL</option>
                        <option value="HYBRID">HYBRID</option>
                        <option value="ELECTRIC">ELECTRIC</option>
                    </select>
                    <input type="submit" value="change" class="submitButtonDash">
                </form>

        </section>
        {% if fuelType != "ELECTRIC" %}
        <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 order-1 dashboardSectionRe sec">
        {% else %}
        <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 order-1 dashboardSectionRe sec" hidden>
        {% endif %}
            <p class="text-lg md:text-xl">Fuel Level:</p>
            <div class="flex items-center gap-1 mt-2 mb-4">
                <p class="text-base md:text-lg" id="fuelICE"> {{fuelICE}} </p>
                <p class="text-base md:text-lg">l</p>
            </div>
                <form data-attribute="fuelICE" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                    <input type="hidden" name="attribute" value="fuelICE">
                    <input type="number" name="value" min="0" class="min-w-50 max-w-75 inputText">
                    <input type="submit" value="change" class="submitButtonDash">

                </form>

        </section>


        {% if fuelType == "HYBRID" or fuelType == "ELECTRIC" %}
        <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 order-3 md:order-2 dashboardSectionRe sec">
        {% else %}
        <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 order-3 md:order-2 dashboardSectionRe sec" hidden>
        {% endif %}
            <p class="text-lg md:text-xl">Battery Level:</p>
            <div class="flex items-center gap-1 mt-2 mb-4">
                <p class="text-base md:text-lg" id="fuelElectric">{{fuelElectric}}</p>
                <p class="text-base md:text-lg">%</p>
            </div>   
                <form data-attribute="fuelElectric" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                    <input type="hidden" name="attribute" value="fuelElectric">
                    <input type="number" name="value" min="0" class="min-w-50 max-w-75 inputText">
                    <input type="submit" value="change" class="submitButtonDash">
                </form>

        </section>

        </div>

</div>
