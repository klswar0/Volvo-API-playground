<div  id="car-info" class="flex flex-col justify-center items-center gap-4 mt-6">
    <button hx-get="/internal/dashboard/car/Base?key={{ key }}&VIN={{ VIN }}" hx-target="#car-info"
        hx-swap="outerHTML transition:true"
        class="sec min-w-40 whitespace-nowrap mt-4 px-4 py-2.5 text-lg bg-blue-500/50 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
        Back
    </button>
    <div class="flex flex-row gap-4 mt-6 items-center justify-center flex-wrap">
        <section class="w-full max-w-75  sm:max-w-125 sm:min-w-100  order-5 dashboardSectionRe sec">
            <p class="text-lg md:text-xl">Availability Status:</p>    
            <div class="mt-2 mb-4">
                <p class="text-base md:text-lg" id="availabilityStatus_value">{{ availabilityStatus_value }}</p>
            </div>
            <form data-attribute="availabilityStatus_value" hx-ext="json-enc"
                hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                <input type="hidden" name="attribute" value="availabilityStatus_value">
                <select name="value" class="inputSelection">
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="UNAVAILABLE">UNAVAILABLE</option>
                    <option value="UNSPECIFIED">UNSPECIFIED</option>
                </select>
                <input type="submit" value="change" class="submitButtonDash">
            </form>

        </section>


        <section class="w-full max-w-75  sm:max-w-125 sm:min-w-100  order-6 dashboardSectionRe sec">
        <p class="text-lg md:text-xl">Availability Status Unavailable Reason:</p>
        {# if car is available this should be displayed TODO #}
            <div class="mt-2 mb-4">
                {% if availabilityStatus_unavailableReason != "" %}
                <p class="text-base md:text-lg" id="availabilityStatus_unavailableReason">{{ availabilityStatus_unavailableReason }}</p>
                {% else %}
                <p class="text-base md:text-lg" id="availabilityStatus_unavailableReason">NOT SET</p>
                {% endif %}
            </div>
            <form data-attribute="availabilityStatus_unavailableReason" hx-ext="json-enc"
                hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                <input type="hidden" name="attribute" value="availabilityStatus_unavailableReason">
                <select name="value" class="inputSelection">
                    <option value="UNSPECIFIED">UNSPECIFIED</option>
                    <option value="NO_INTERNET">NO_INTERNET</option>
                    <option value="POWER_SAVING_MODE">POWER_SAVING_MODE</option>
                    <option value="CAR_IN_USE">CAR_IN_USE</option>
                </select>
                <input type="submit" value="change" class="submitButtonDash">
            </form>

        </section>
    </div>

</div>
