<div  id="car-info" class="flex flex-col justify-center items-center gap-4 mt-6">
    <button hx-get="/internal/dashboard/car/v2/Base?key={{ key }}&VIN={{ VIN }}" hx-target="#car-info"
        hx-swap="outerHTML transition:true"
        class="sec min-w-40 whitespace-nowrap mt-4 px-4 py-2.5 text-lg bg-blue-500/50 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
        Back
    </button>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6 justify-items-center items-center max-w-200 mx-auto">
            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Front Left:</p>
                <div class="mt-2 mb-4">
                    <p class="text-base md:text-lg " id="frontLeft">{{frontLeft}}</p>
                </div>
                <form data-attribute="frontLeft" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response"><input type="hidden"
                        name="attribute" value="frontLeft">
                    <select name="value" class="inputSelection">
                        <option value="UNSPECIFIED">UNSPECIFIED</option>
                        <option value="NO_WARNING">NO_WARNING</option>
                        <option value="VERY_LOW_PRESSURE">VERY_LOW_PRESSURE</option>
                        <option value="LOW_PRESSURE">LOW_PRESSURE</option>
                        <option value="HIGH_PRESSURE">HIGH_PRESSURE</option>
                    </select>
                    <input type="submit" value="change" class="submitButtonDash">

                </form>

            </section>
            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Front Right:</p>
                <div class="mt-2 mb-4">
                    <p class="text-base md:text-lg" id="frontRight">{{frontRight}}</p>
                </div>
                <form data-attribute="frontRight" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response"><input type="hidden"
                        name="attribute" value="frontRight">
                    <select name="value" class="inputSelection">
                        <option value="UNSPECIFIED">UNSPECIFIED</option>
                        <option value="NO_WARNING">NO_WARNING</option>
                        <option value="VERY_LOW_PRESSURE">VERY_LOW_PRESSURE</option>
                        <option value="LOW_PRESSURE">LOW_PRESSURE</option>
                        <option value="HIGH_PRESSURE">HIGH_PRESSURE</option>
                    </select>
                    <input type="submit" value="change" class="submitButtonDash">

                </form>

            </section>

            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Rear Left:</p>
                <div class="mt-2 mb-4">
                    <p class="text-base md:text-lg " id="rearLeft">{{rearLeft}}</p>
                </div>
                <form data-attribute="rearLeft" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response"><input type="hidden"
                        name="attribute" value="rearLeft">
                    <select name="value" class="inputSelection">
                        <option value="UNSPECIFIED">UNSPECIFIED</option>
                        <option value="NO_WARNING">NO_WARNING</option>
                        <option value="VERY_LOW_PRESSURE">VERY_LOW_PRESSURE</option>
                        <option value="LOW_PRESSURE">LOW_PRESSURE</option>
                        <option value="HIGH_PRESSURE">HIGH_PRESSURE</option>
                    </select>
                    <input type="submit" value="change" class="submitButtonDash">
                </form>

            </section>
            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Rear Right:</p>
                <div class="mt-2 mb-4">
                    <p class="text-base md:text-lg " id="rearRight">{{rearRight}}</p>
                </div>
                <form data-attribute="rearRight" hx-ext="json-enc"
                    hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response"><input type="hidden"
                        name="attribute" value="rearRight">
                    <select name="value" class="inputSelection">
                        <option value="UNSPECIFIED">UNSPECIFIED</option>
                        <option value="NO_WARNING">NO_WARNING</option>
                        <option value="VERY_LOW_PRESSURE">VERY_LOW_PRESSURE</option>
                        <option value="LOW_PRESSURE">LOW_PRESSURE</option>
                        <option value="HIGH_PRESSURE">HIGH_PRESSURE</option>
                    </select>
                    <input type="submit" value="change" class="submitButtonDash">
                </form>

            </section>


        </div>

</div>
