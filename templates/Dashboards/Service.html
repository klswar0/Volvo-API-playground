<div  id="car-info" class="flex flex-col justify-center items-center gap-4 mt-6">
    <button hx-get="/internal/dashboard/car/Base?key={{ key }}&VIN={{ VIN }}" hx-target="#car-info"
        hx-swap="outerHTML transition:true"
        class="sec min-w-40 whitespace-nowrap mt-4 px-4 py-2.5 text-lg bg-blue-500/50 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
        Back
    </button>
        <div class="flex flex-row gap-4 mt-6 items-center justify-center flex-wrap">
            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Service warning:</p>

                    <div class="mt-2 mb-4">
                        <p class="text-base md:text-lg " id="serviceWarning">{{serviceWarning}}</p>
                    </div>
                    <form data-attribute="serviceWarning" hx-ext="json-enc"
                        hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                        <input type="hidden" name="attribute" value="serviceWarning">
                        <select name="value" class="inputSelection">
                            <option value="UNSPECIFIED">UNSPECIFIED</option>
                            <option value="NO_WARNING">NO_WARNING</option>
                            <option value="UNKNOWN_WARNING">UNKNOWN_WARNING</option>
                            <option value="REGULAR_MAINTENANCE_ALMOST_TIME_FOR_SERVICE">REGULAR_MAINTENANCE_ALMOST_TIME_FOR_SERVICE</option>
                            <option value="ENGINE_HOURS_ALMOST_TIME_FOR_SERVICE">ENGINE_HOURS_ALMOST_TIME_FOR_SERVICE</option>
                            <option value="DISTANCE_DRIVEN_ALMOST_TIME_FOR_SERVICE">DISTANCE_DRIVEN_ALMOST_TIME_FOR_SERVICE</option>
                            <option value="REGULAR_MAINTENANCE_TIME_FOR_SERVICE">REGULAR_MAINTENANCE_TIME_FOR_SERVICE</option>
                            <option value="ENGINE_HOURS_TIME_FOR_SERVICE">ENGINE_HOURS_TIME_FOR_SERVICE</option>
                            <option value="DISTANCE_DRIVEN_TIME_FOR_SERVICE">DISTANCE_DRIVEN_TIME_FOR_SERVICE</option>
                            <option value="REGULAR_MAINTENANCE_OVERDUE_FOR_SERVICE">REGULAR_MAINTENANCE_OVERDUE_FOR_SERVICE</option>
                            <option value="ENGINE_HOURS_OVERDUE_FOR_SERVICE">ENGINE_HOURS_OVERDUE_FOR_SERVICE</option>
                            <option value="DISTANCE_DRIVEN_OVERDUE_FOR_SERVICE">DISTANCE_DRIVEN_OVERDUE_FOR_SERVICE</option>
                        </select>
                        <input type="submit" value="change" class="submitButtonDash">
                    </form>

            </section>

            <section class="w-full max-w-75 sm:max-w-100 sm:min-w-75 dashboardSectionRe sec">
                <p class="text-lg md:text-xl">Service trigger:</p>

                    <div class="mt-2 mb-4">
                        <p class="text-base md:text-lg " id="serviceTrigger">{{serviceTrigger}}</p>
                    </div>
                <form data-attribute="serviceTrigger" hx-ext="json-enc"
                hx-post="/internal/dashboard/update?VIN={{ VIN }}&key={{ key }}" hx-target="#response">
                <input type="hidden" name="attribute" value="serviceTrigger">
                <select name="value" class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all appearance-none cursor-pointer text-center [text-align-last:center]">
                    <option value="CALENDAR_TIME">CALENDAR_TIME</option>
                    <option value="DISTANCE">DISTANCE</option>
                    <option value="ENGINE_HOURS">ENGINE_HOURS</option>
                    <option value="UNKNOWN">UNKNOWN</option>
                    <option value="UNSPECIFIED">UNSPECIFIED</option>
                </select>
                <input type="submit" value="change" class="submitButtonDash">
            </form>

            </section>
        </div>
</div>
