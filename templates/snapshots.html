<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
    <link rel="stylesheet" href="/internal/style.css">
    <link rel="stylesheet" href="style.css">

</head>
<body class="min-h-screen text-zinc-200 flex flex-col items-center justify-center p-6 md:p-16 selection:bg-sky-300 selection:text-white animate-fade-in-long ">
    <header class="max-w-4xl w-full text-center mb-12 space-y-4">
        <h1 class="text-4xl  md:text-5xl">Snapshots</h1>
        <p class="text-lg  md:text-xl">API key: {{ key }}</p>
    </header>

<main>
    <ul>
        <section class=" mb-2 w-full max-w-md md:min-w-md p-6 bg-zinc-900/50 border border-zinc-800 rounded-2xl shadow-xl backdrop-blur-sm  sec text-center flex flex-col ">
        <li>
            <p class="mb-2 text-lg md:text-xl">Load snapshot</p>

            <form hx-get="/internal/dashboard/snapshots/command?key={{ key }}" hx-target="body" hx-swap="outerHTML transition:true" >
                <select name="name" class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all appearance-none text-center [text-align-last:center] cursor-pointer">
                {% for snapshot in snapshots %}
                    <option value="{{ snapshot }}">{{ snapshot }}</option>
                {% endfor %}
                </select> 
                <button type="submit" name="command" value="load" hx-swap="outerHTML transition:true" 
                    class="w-full mt-2 px-4 py-2.5 bg-blue-500 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
                    Reload data
                </button>
                <p class="text-xs  md:text-sm mt-2">Automatic redirect will occur after selection</p>
            </form>
            <div id="error-response"></div>
        </li>
        </section>
    </ul>
    <section class=" mb-2 w-full max-w-md p-6 bg-zinc-900/50 border border-zinc-800 rounded-2xl shadow-xl backdrop-blur-sm  sec text-center flex flex-col ">
        <form hx-get="/internal/dashboard/snapshots/command?key={{ key }}" hx-target="body" hx-swap="outerHTML transition:true" >
            <p class="mb-2 text-lg md:text-xl">Save snapshot</p>
            <input type="text" name="name" placeholder="Enter snapshot name"
                class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all">

            <button type="submit" name="command" value="save" hx-swap="outerHTML transition:true" 
                class="w-full mt-2 px-4 py-2.5 bg-blue-500 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
                Save data
            </button>
            <div id="saved-response" class="mt-2.5">{{response}}</div>
        </form>
    </section>
</main>
    <button
        class="sec min-w-30px mt-4 px-4 py-2.5 bg-blue-500/30 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer"
        hx-get="/internal/dashboard?key={{ key }}" hx-target="body" hx-swap="outerHTML transition:true">
        Go Back
    </button>
</body>
</html>
