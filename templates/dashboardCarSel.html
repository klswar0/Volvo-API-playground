<!DOCTYPE html>
<html>  
    <head>
        <title>Car dashboard</title>
            <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>

            <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.1/ws.js"></script>{#delete if diffrent wy to dashboard#}

            <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
            <link rel="stylesheet" href="dashboardCarSel.css">

    </head>    



    <body>
        <h1>Car list</h1>
        <ul>
            {% for vin in VINs%}
            <li class="premium-card-dark">
                {{ vin }}
                <form hx-get="/internal/dashboard/redirect" hx-vals='js:{
                    "key": new URLSearchParams(window.location.search).get("key") || ""
                    }' hx-target="body" hx-swap="outerHTML" hx-oob>
                    <button type="submit" name="VIN" value="{{ vin }}" hx-swap="outerHTML" hx-swap-oob="true">Select</button>
                </form>

            </li>
            {% endfor %}
        </ul>

        
        <form hx-post="dashboard/NewCar" hx-vals='js:{
                    "key": new URLSearchParams(window.location.search).get("key") || ""}' class="premium-card-dark" id="New-car">
            <h3>Create new car</h3>
            <input type="text" name="VIN" placeholder="Enter VIN">
            <button type="submit">Create</button>
        </form>
    </body>
</html>
