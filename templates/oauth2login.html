<!DOCTYPE html>
<html>  
    <head>
        <title>Car dashboard</title>
            <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>
    </head>    

<body>
    <h1>OAuth2 login</h1>
    <p style="color:red">Not real VOLVO site</p>
    <p>Login is your API key</p>
    <form hx-post="/as/authorization.internal" hx-target="#response" hx-swap="innerHTML">
        <h3>Login</h3>
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="client_id" value="{{ client_id }}">
        <input type="hidden" name="state" value="{{ state }}">
        <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
        <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">

        <input type="text" name="login" placeholder="Enter API key">
        <button type="submit">Login</button>
    </form>
    <div id="response"></div>
</body>
