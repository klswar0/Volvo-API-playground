<!DOCTYPE html>
<html>  
    <head>
        <title>Car dashboard</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>


            <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.1/ws.js"></script>



            <link rel="stylesheet" href="/internal/style.css">
        <style>
            .pixelArt {
                image-rendering: pixelated;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
            .cluster {
                position: relative;
                width: 190px;
                height: 250px;
                margin: 20px auto;
                background-color: #f0f0f0;
            }
        </style>
    </head>    

    <body>
        <div class="cluster">
            <div hx-ext="ws" ws-connect="/internal/dashboard/ws/Iframe?VIN={{VIN}}&key={{key}}">
                <div id="car-visual" hx-swap-oob="true" hx-swap="innerHTML transition:true">   
                    <p>Awaiting real-time vehicle data connection...</p>
                </div>
            </div>
        </div>

    </body>
</html>
