<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
    <link rel="stylesheet" href="/internal/style.css">


</head>

<body class="min-h-screen text-zinc-200 flex flex-col items-center justify-center p-6 md:p-16 selection:bg-sky-300 selection:text-white animate-fade-in-long ">
    <header class="max-w-4xl w-full text-center mb-12 space-y-4">
        <h1 class="text-4xl  md:text-5xl">Scenarios</h1>
        <p class="text-lg  md:text-xl">API key: {{ key }}</p>
        <p class="text-lg  md:text-xl">VIN: {{ vin }}</p>
    </header>

    <main>
        <ul>

            <li>
                <section class=" mb-2 min-w-md p-6 bg-zinc-900/50 border border-zinc-800 rounded-2xl shadow-xl backdrop-blur-sm  sec text-center flex flex-col ">
                    <p class="text-lg  md:text-xl mb-2">Select a scenario to load</p>
                    <form hx-get="/internal/dashboard/loading?key={{ key }}&VIN={{ vin }}" hx-target="body" hx-swap="outerHTML transition:true" >
                         <select name="name" class="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all appearance-none text-center [text-align-last:center] cursor-pointer">
                            {% for scenario in scenarios %}
                            <option value="{{ scenario }}">{{ scenario }}</option>
                            {% endfor %}
                        </select> 

                        <button type="submit" hx-swap="outerHTML transition:true" 
                        class="w-full mt-2 px-4 py-2.5 bg-blue-500 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer">
                            load
                        </button>

                    </form>
                    <p class="text-xs  md:text-sm mt-2">Automatic redirect will occur after selection</p>
                </section>
            </li>

        </ul>



    </main>
    <button
        class="sec min-w-30px mt-4 px-4 py-2.5 bg-blue-500/30 text-white rounded-xl hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-1 transition-all active:scale-[0.98] cursor-pointer"
        hx-get="/internal/dashboard?key={{ key }}" hx-target="body" hx-swap="outerHTML transition:true">
        Go Back
    </button>

    
    </div>
</body>
</html>
