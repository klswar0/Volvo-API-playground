<!DOCTYPE html>
    <html>
    <head>
   
        <title>Playground login</title>
        <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>

        <link rel="stylesheet" href="welcome.css">

        
    </head>
    <body>
        <div class="premium-card-dark">
        <div id="welcome-form">
        <h1>Welcome to Volvo API Playground Dashboard</h1>
        <p>Please enter your API key to access the playground.</p>
        <form hx-get="/internal/welcome/Check" hx-target="#error-message" class="input-form">
            <label>Enter your API Key:</label><br>
            <input type="text" id="vcc_api_key" name="vcc_api_key" required >
            <input id="submit-btn" type="submit" value="Submit">
        </form>
        <div id="error-message"></div>
        </div>
        <div id="generate-api-key">
        <p>No API key? Generate one.</p>
        <button 
            class="generate-button" 
            hx-get="/internal/welcome/APIKey" 
            hx-target="#generate-api-key" 
            hx-swap="outerHTML"
            
        >
        Generate API Key
        </button>
        </div>
    </div>
    </body>
    </html>
